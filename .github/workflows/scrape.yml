# Free-IP-rotation scraper. Each run launches on a fresh GitHub-hosted runner
# with a different egress IP from GitHub's pool. Public repos = unlimited free
# minutes. The matrix runs 20 jobs in parallel = 20 different IPs concurrently.
# Cron every 15 min keeps a steady fill going.
name: scrape-images

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # manual trigger button in the GH UI

# No concurrency group — let multiple triggers run in parallel. The atomic
# claim sentinel + SKIP LOCKED guarantees no shard ever claims the same row.
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # 8 parallel jobs per trigger. We tried 20 — Postgres f1-micro deadlocked
        # under that concurrency (Cloud SQL has ~25 connection cap + each shard
        # runs FOR UPDATE SKIP LOCKED on big batches → lock contention spiked).
        # 8 shards × 800 batch = ~6K images per cron wave, still fast enough.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: scrape one batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scraper.py --batch 800 --workers 8

  # Keep Render free-tier services from sleeping (15min idle = cold start).
  # Runs on the same */15 cron as the scrape, but as ONE job (not 20 shards)
  # so we don't hammer the health endpoints. fail-fast=false on the scrape
  # job means this still runs even if shards fail.
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ping liberator-backend
        run: curl -fsS --max-time 30 https://liberator-backend.onrender.com/health || echo "backend ping failed (non-fatal)"
      - name: ping kiro-gateway
        run: curl -fsS --max-time 30 https://liberator-kiro-gw.onrender.com/health || echo "kiro-gw ping failed (non-fatal)"
